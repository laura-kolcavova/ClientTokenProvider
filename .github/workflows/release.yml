name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install workloads
        run: dotnet workload restore src/KittyToken.Maui/KittyToken.Maui.csproj

      - name: Publish x64
        run: dotnet publish src/KittyToken.Maui/KittyToken.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:DebugType=None /p:DebugSymbols=false

      - name: Zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $src = 'src/KittyToken.Maui/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish'
          Compress-Archive -Path "$src\*" -DestinationPath "KittyToken-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KittyToken-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
